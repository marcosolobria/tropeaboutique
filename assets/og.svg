<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3faf6"/>
      <stop offset="50%" stop-color="#dff3ea"/>
      <stop offset="100%" stop-color="#aee0d3"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4A7B9" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F4A7B9" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative waves -->
  <ellipse cx="600" cy="700" rx="800" ry="300" fill="#F4A7B9" fill-opacity="0.08"/>
  <ellipse cx="200" cy="580" rx="400" ry="200" fill="#F4A7B9" fill-opacity="0.06"/>
  <ellipse cx="1050" cy="100" rx="300" ry="180" fill="#fce8d3" fill-opacity="0.5"/>

  <!-- Pez decorativo (mismo diseño que el logo) -->
  <g transform="translate(40, 440) scale(2.4)" opacity="0.18">
    <path d="M43,58 C30,44 15,31 2,24 C10,38 16,48 20,58Z" fill="#1a1a1a"/>
    <path d="M43,64 C30,78 15,91 2,98 C10,84 16,74 20,64Z" fill="#1a1a1a"/>
    <path d="M50,31 C58,22 70,18 80,18 C95,18 108,24 115,36 C122,46 125,56 125,61 C125,66 122,76 115,86 C108,98 95,104 80,104 C70,104 58,100 50,91 C45,84 43,74 43,61 C43,48 45,38 50,31Z" fill="#1a1a1a"/>
    <path d="M68,20 C60,8 48,2 38,3 C46,14 56,22 64,28Z" fill="#1a1a1a"/>
    <path d="M58,100 C52,110 42,114 34,112 C44,106 52,100 56,94Z" fill="#1a1a1a"/>
    <path d="M72,102 C68,111 60,115 53,114 C60,108 66,103 70,97Z" fill="#1a1a1a"/>
  </g>

  <!-- Fish logo (scaled up, centered-ish) -->
  <g transform="translate(330, 195) scale(1.42)">
    <!-- Cola: doble luna con hueco -->
    <path d="M37,49 C26,38 13,26 1,20 C8,32 13,41 16,49Z" fill="#1a1a1a"/>
    <path d="M37,54 C26,65 13,77 1,83 C8,71 13,62 16,54Z" fill="#1a1a1a"/>
    <!-- Cuerpo redondo + hocico -->
    <path d="M43,26 C49,18 59,15 67,15 C80,15 91,20 96,30 C102,38 104,46 104,51 C104,56 102,64 96,72 C91,82 80,87 67,87 C59,87 49,84 43,76 C39,70 37,62 37,51 C37,40 39,32 43,26Z" fill="#1a1a1a"/>
    <!-- Aleta dorsal -->
    <path d="M57,17 C50,7 40,2 31,3 C38,12 47,19 54,24Z" fill="#1a1a1a"/>
    <!-- Aletas ventrales -->
    <path d="M49,83 C44,91 36,95 29,93 C37,88 44,83 47,78Z" fill="#1a1a1a"/>
    <path d="M61,85 C57,92 50,96 44,95 C50,90 55,86 59,81Z" fill="#1a1a1a"/>
    <!-- Ojo -->
    <ellipse cx="88" cy="38" rx="5.5" ry="7" fill="white"/>
    <!-- TROPEA -->
    <text x="141" y="40" font-family="Georgia,'Times New Roman',serif" font-size="26" font-weight="700" fill="#1a1a1a" letter-spacing="2.5">TROPEA</text>
    <!-- Línea rosa -->
    <line x1="141" y1="48" x2="367" y2="48" stroke="#F4A7B9" stroke-width="1.2"/>
    <!-- BOUTIQUE -->
    <text x="142" y="65" font-family="Georgia,'Times New Roman',serif" font-size="11" font-weight="400" fill="#1a1a1a" letter-spacing="6">BOUTIQUE</text>
    <!-- Punto rosa -->
    <circle cx="130" cy="56" r="2.5" fill="#F4A7B9"/>
  </g>

  <!-- Tagline -->
  <text x="600" y="370" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="42" font-style="italic" fill="#d4607a" opacity="0.9">L'amour dans chaque détail</text>

  <!-- Subtitle -->
  <text x="600" y="420" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#888" letter-spacing="1">Accessoires faits main · Marseille · Accesorios artesanales</text>

  <!-- Pink line accent -->
  <line x1="480" y1="445" x2="720" y2="445" stroke="#F4A7B9" stroke-width="1.5"/>

  <!-- Bottom label -->
  <text x="600" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#bbb" letter-spacing="3">TROPEABOUTIQUE.COM</text>
</svg>
